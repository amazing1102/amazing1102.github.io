<div id="admin" hidden aria-label="文章管理" role="region">
  <div class="admin-bar"><h2>文章管理</h2><button class="quiet-button" id="close-admin" type="button">收起</button></div>
  <div class="admin-panel" id="secure-entry" hidden>
    <p>连接 GitHub 需要使用 HTTPS 主页。</p>
    <div class="admin-actions"><a href="https://cloverneo.com/#admin">打开 HTTPS 主页</a><a href="https://github.com/amazing1102/amazing1102.github.io/tree/main/_posts">在 GitHub 管理文章 ↗</a></div>
  </div>
<section class="admin-panel" id="auth-panel" hidden aria-labelledby="auth-heading">
      <div class="admin-panel-heading"><div><h2 id="auth-heading">连接 GitHub</h2><p>使用一个只允许操作此仓库内容的 Fine-grained Token。</p></div><span class="connection-dot" id="connection-dot"></span></div>
      <label for="token">GitHub Token</label>
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
      <div class="admin-actions"><button class="admin-button" id="connect" type="button">验证并连接</button><button class="quiet-button" id="disconnect" type="button" hidden>退出管理</button><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer">创建 Token ↗</a></div>
      <p class="admin-help">Token 只保存在当前标签页，关闭标签页后会清除。创建时选择此仓库，并只勾选 <strong>Contents: Read and write</strong>。</p>
      <p class="admin-status" id="auth-status" role="status"></p>
    </section>

    <div id="workspace" hidden>
      <section class="admin-panel" aria-labelledby="publish-heading">
        <div class="admin-panel-heading"><div><h2 id="publish-heading">发布新文章</h2><p id="publish-note">Markdown 正文会直接提交到 GitHub，Pages 构建完成后自动上线。</p></div></div>
        <div class="edit-bar" id="edit-bar" hidden>
          <span class="edit-target">正在编辑：<strong id="edit-target-name"></strong></span>
          <button class="quiet-button" id="cancel-edit" type="button">取消编辑</button>
        </div>
        <form id="publish-form">
          <div class="form-grid"><label>标题<input name="title" required maxlength="90" placeholder="今天学会了什么？"></label><label>栏目<select name="category"><option value="learn">学习</option><option value="life">日常</option></select></label></div>
          <label>摘要<input name="summary" required maxlength="180" placeholder="用一句话说明这篇记录。"></label>
          <div class="group-row"><label>分组 <span class="field-note">可选，输入新名称即可创建分组</span><input name="group" list="group-options" maxlength="40" autocomplete="off" placeholder="例如：A组（留空即为未分组）"></label><datalist id="group-options"></datalist></div>
          <div class="editor-toolbar"><input id="import-file" type="file" accept=".md,.markdown,.txt,.docx,text/markdown,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><label class="import-button" for="import-file">导入文档</label><input id="image-file" type="file" accept="image/*"><label class="import-button" for="image-file">插入图片</label><span id="draft-state" role="status">草稿自动保存</span></div>
          <label>正文 <span class="field-note">支持 Markdown 与 Mermaid</span><textarea name="body" required placeholder="写下你的记录……"></textarea></label>
          <p class="admin-status" id="import-status" role="status"></p>
          <div class="admin-actions"><button class="admin-button" id="publish-submit" type="submit">发布文章</button><button class="quiet-button" id="clear-draft" type="button">清空</button></div>
          <p class="admin-status" id="publish-status" role="status"></p>
        </form>
      </section>

      <section class="admin-panel" aria-labelledby="posts-heading"><div class="admin-panel-heading"><div><h2 id="posts-heading">已发布文章</h2><p>可以编辑或删除已发布文章；删除会直接提交到仓库，无法从网站撤回。</p></div><button class="quiet-button" id="refresh-posts" type="button">刷新列表</button></div><div class="post-list" id="post-list"></div><p class="admin-status" id="posts-status" role="status"></p></section>
    </div>
</div>
