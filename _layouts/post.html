---
layout: base
---
<main id="main" class="reader">
  <a class="back" href="{{ '/#notes' | relative_url }}">← 返回记录</a>
  <div class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time><span class="category {{ page.category | escape }}">{% if page.category == 'life' %}日常{% else %}学习{% endif %}</span>{% if page.group and page.group != '未分组' %}<span class="group-chip">{{ page.group | escape }}</span>{% endif %}</div>
  <h1>{{ page.title | escape }}</h1><p class="byline">cloverneo</p>
  <article class="prose">{{ content }}</article>
</main>
<script defer src="{{ '/assets/mermaid.min.js' | relative_url }}"></script>
<script defer src="{{ '/mermaid.js' | relative_url }}"></script>
