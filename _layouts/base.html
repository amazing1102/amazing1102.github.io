<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | default: 'cloverneo 的学习笔记和日常手记。' | escape }}">
  <title>{{ page.title | default: '个人主页' | escape }} · cloverneo</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/avatar.png' | relative_url }}">
  <script defer src="{{ '/script.js' | relative_url }}"></script>
</head><body id="top">
  <header class="top"><div class="shell top-inner">
    <a href="{{ '/' | relative_url }}" class="wordmark"><span class="mark" aria-hidden="true">✳</span> cloverneo</a>
    <nav aria-label="主导航"><a href="{{ '/#notes' | relative_url }}">学习与日常</a><a href="https://github.com/amazing1102">GitHub ↗</a></nav>
    <button type="button" id="theme" aria-label="切换深色模式" title="切换深色模式"><img width="18" height="18" alt="" src="{{ '/assets/moon.svg' | relative_url }}"></button>
  </div></header>
  {{ content }}
  <footer class="shell"><span>© {{ site.time | date: '%Y' }} cloverneo</span><a href="#top">回到顶部 ↑</a></footer>
</body></html>
